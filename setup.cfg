[metadata]
name = visu_orange_v4
version = 4.0.0
description = Bibliothèque de visualisation TEMPO v4 pour Orange Data Mining
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.12
install_requires =
    Orange3>=3.40.0
    AnyQt
    PyQt6
    PyQt6-WebEngine
    plotly>=5.0.0

[options.entry_points]
orange.widgets =
    TEMPO = tempo.widgets

[options.package_data]
tempo.widgets.graphique = *.js, *.md, *.html
